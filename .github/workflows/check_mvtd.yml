name: Check DP-900 Virtual Training Days

on:
  schedule:
    # 毎日 UTC 00:00（JST 09:00）に定期実行
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write # Issueを作成するための権限

jobs:
  check-events:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Event Checker
        run: |
          python check_events.py

      - name: Create Issue if Events Found
        if: hashFiles('result.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "【DP-900 割引検知】Virtual Training Day が見つかりました" \
            --body-file result.md \
            --assignee "@me"